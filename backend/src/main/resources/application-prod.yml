spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  data:
    redis:
      url: ${SPRING_DATA_REDIS_URL:redis://localhost:6379}

app:
  jwt:
    secret: ${JWT_SECRET}

logging:
  level:
    root: INFO
    za.co.shoppingdiary: INFO