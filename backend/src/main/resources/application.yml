spring:
  application:
    name: shopping-diary-api
  profiles:
    default: local

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    default-property-inclusion: non_null

  data:
    redis:
      repositories:
        enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

server:
  port: ${PORT:8080}
  error:
    include-message: always

springdoc:
  swagger-ui:
    path: /swagger-ui
  api-docs:
    path: /v3/api-docs

app:
  jwt:
    # Base64-encoded HS256 secret. THIS IS A DEV KEY — replace in prod.
    # Generate one with: openssl rand -base64 32
    secret: ${JWT_SECRET:c2hvcHBpbmctZGlhcnktZGV2LWp3dC1zZWNyZXQta2V5LXJlcGxhY2UtbWUtaW4tcHJvZA==}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  bootstrap:
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}

loyaltyhub:
  api:
    key: ${LOYALTYHUB_API_KEY:lh_live_25a86d6f1c62c76acdf487bc3685c558da10abb0d571be35}

reefapi:
