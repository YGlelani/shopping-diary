spring:
  application:
    name: shopping-diary-api
  config:
    import: "optional:file:.env[.properties]"

  profiles:
    default: local

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    default-property-inclusion: non_null

  data:
    redis:
      repositories:
        enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

springdoc:
  swagger-ui:
    path: /swagger-ui
  api-docs:
    path: /v3/api-docs

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  bootstrap:
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}

shopping-diary:
  promotions:
    reef-enabled: ${SPECIALS_REEF_IMPORT_ENABLED:false}
    reef-cron: "${SPECIALS_REEF_IMPORT_CRON:0 25 5 * * *}"
  prices:
    max-age-days: ${PRICE_MAX_AGE_DAYS:7}

loyaltyhub:
  api:
    key: ${LOYALTYHUB_API_KEY:}

reefapi:
  api:
    key: ${REEFAPI_KEY:}

logging:
  level:
    root: INFO
    za.co.shoppingdiary: INFO
